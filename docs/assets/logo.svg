<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041a20"/>
      <stop offset="50%" stop-color="#072932"/>
      <stop offset="100%" stop-color="#021217"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#0e434f" stroke-width="0.8" opacity="0.5"/>
    </pattern>

    <!-- Text Gradient (Icy Blue / Cyan) -->
    <linearGradient id="iceCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0faff"/>
      <stop offset="35%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Screen Glow -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a47"/>
      <stop offset="100%" stop-color="#0d1b22"/>
    </radialGradient>
  </defs>

  <!-- Base Icon Plate (Dark Teal with Tech Grid & Cyan Border) -->
  <rect x="4" y="4" width="248" height="248" rx="36" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="248" height="248" rx="36" fill="url(#techGrid)"/>
  <rect x="4" y="4" width="248" height="248" rx="36" fill="none" stroke="#38d9f5" stroke-width="2" opacity="0.6"/>

  <!-- Retro Window Container -->
  <g id="retro-window" transform="translate(24, 20)">
    <!-- 3D Window Frame -->
    <rect x="0" y="0" width="208" height="216" fill="#d4d0c8" stroke="#ffffff" stroke-width="2"/>
    <!-- Bottom/Right Dark 3D Shadow Borders -->
    <line x1="208" y1="0" x2="208" y2="216" stroke="#404040" stroke-width="3"/>
    <line x1="0" y1="216" x2="208" y2="216" stroke="#404040" stroke-width="3"/>

    <!-- Navy Blue Titlebar -->
    <rect x="4" y="4" width="200" height="22" fill="#000080"/>
    <text x="10" y="19" fill="#ffffff" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="900" letter-spacing="1">TENSILE OS</text>

    <!-- Window Control Buttons -->
    <g transform="translate(144, 7)">
      <!-- Min -->
      <rect x="0" y="0" width="16" height="15" fill="#d4d0c8" stroke="#404040" stroke-width="1"/>
      <line x1="4" y1="11" x2="11" y2="11" stroke="#000000" stroke-width="2"/>
      <!-- Max -->
      <rect x="18" y="0" width="16" height="15" fill="#d4d0c8" stroke="#404040" stroke-width="1"/>
      <rect x="22" y="4" width="8" height="7" fill="none" stroke="#000000" stroke-width="1.5"/>
      <!-- Close -->
      <rect x="36" y="0" width="16" height="15" fill="#d4d0c8" stroke="#404040" stroke-width="1"/>
      <path d="M 40,4 L 48,11 M 48,4 L 40,11" stroke="#000000" stroke-width="1.8"/>
    </g>

    <!-- Window Client Area (Warm Off-White) -->
    <rect x="4" y="28" width="200" height="184" fill="#eeebe2"/>
    <rect x="6" y="30" width="196" height="180" fill="none" stroke="#808080" stroke-width="1"/>

    <!-- Inside Content: Circuit Traces (Cyan) -->
    <path d="M 120,126 L 140,126 L 152,140 L 168,140" fill="none" stroke="#00ccb0" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 120,132 L 136,132 L 144,146 L 168,146" fill="none" stroke="#00ccb0" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="140" cy="126" r="2.5" fill="#00e5ff"/>
    <circle cx="136" cy="132" r="2.5" fill="#00e5ff"/>

    <!-- ESP32 Chip -->
    <g transform="translate(156, 130)">
      <!-- Pins -->
      <rect x="-4" y="4" width="4" height="2" fill="#a0a0a0"/>
      <rect x="-4" y="9" width="4" height="2" fill="#a0a0a0"/>
      <rect x="-4" y="14" width="4" height="2" fill="#a0a0a0"/>
      <rect x="32" y="4" width="4" height="2" fill="#a0a0a0"/>
      <rect x="32" y="9" width="4" height="2" fill="#a0a0a0"/>
      <rect x="32" y="14" width="4" height="2" fill="#a0a0a0"/>
      <rect x="6" y="-3" width="2" height="3" fill="#a0a0a0"/>
      <rect x="12" y="-3" width="2" height="3" fill="#a0a0a0"/>
      <rect x="18" y="-3" width="2" height="3" fill="#a0a0a0"/>
      <rect x="24" y="-3" width="2" height="3" fill="#a0a0a0"/>
      <rect x="6" y="20" width="2" height="3" fill="#a0a0a0"/>
      <rect x="12" y="20" width="2" height="3" fill="#a0a0a0"/>
      <rect x="18" y="20" width="2" height="3" fill="#a0a0a0"/>
      <rect x="24" y="20" width="2" height="3" fill="#a0a0a0"/>
      <!-- Chip Body -->
      <rect x="0" y="0" width="32" height="20" rx="2" fill="#1b2024" stroke="#000000" stroke-width="1"/>
      <text x="4" y="14" fill="#38d9f5" font-family="monospace" font-size="8" font-weight="bold">ESP32</text>
    </g>

    <!-- Retro Isometric Computer Monitor -->
    <g transform="translate(38, 40)">
      <!-- Computer Housing Shadow -->
      <polygon points="12,94 92,94 84,102 4,102" fill="#000000" opacity="0.15"/>

      <!-- Base Housing (Beige) -->
      <polygon points="10,68 84,68 94,84 20,84" fill="#dfdacf"/>
      <polygon points="94,84 20,84 20,94 94,94" fill="#b8b2a5"/>
      <polygon points="94,84 100,72 100,82 94,94" fill="#9c9688"/>
      <!-- Floppy Drive Slot -->
      <rect x="52" y="87" width="28" height="3" fill="#2d2b27"/>
      <rect x="82" y="88" width="3" height="2" fill="#00ff66"/>

      <!-- Neck / Stand -->
      <rect x="42" y="58" width="20" height="12" fill="#a8a296"/>

      <!-- CRT Monitor Bezel (Beige 3D) -->
      <!-- Top -->
      <polygon points="14,10 74,10 88,18 28,18" fill="#ebe7dc"/>
      <!-- Front Bezel -->
      <rect x="14" y="10" width="60" height="52" rx="3" fill="#dcd7ca" stroke="#908a7c" stroke-width="1.5"/>
      <!-- Side -->
      <polygon points="74,10 92,20 92,54 74,62" fill="#b5b0a2"/>
      <polygon points="14,62 74,62 92,54 32,54" fill="#989386"/>

      <!-- CRT Screen Inset -->
      <rect x="20" y="16" width="46" height="38" rx="4" fill="url(#screenGlow)" stroke="#1a252c" stroke-width="2"/>
      <!-- Phosphor Scanline Glow on Screen -->
      <path d="M 24,32 Q 34,22 44,34 T 62,30" fill="none" stroke="#00f0ff" stroke-width="1.8" opacity="0.9"/>
      <rect x="24" y="42" width="14" height="2" fill="#38d9f5" opacity="0.7"/>

      <!-- Retro Keyboard -->
      <g transform="translate(-16, 80)">
        <polygon points="10,12 56,12 66,32 6,32" fill="#e5e1d6" stroke="#8c8678" stroke-width="1"/>
        <!-- Key Rows -->
        <polygon points="12,14 54,14 56,18 11,18" fill="#cbc6b8"/>
        <polygon points="11,19 57,19 59,23 10,23" fill="#cbc6b8"/>
        <polygon points="10,24 60,24 62,28 9,28" fill="#cbc6b8"/>
        <!-- Spacebar / Enter -->
        <rect x="24" y="25" width="22" height="4" fill="#a49e90"/>
        <rect x="52" y="19" width="6" height="8" fill="#d9534f"/>
      </g>
    </g>

    <!-- Bottom Pixel Branding: TENSILE OS -->
    <g transform="translate(10, 168)">
      <!-- Black Pixel Shadow -->
      <text x="2" y="28" fill="#041a20" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" font-weight="900" letter-spacing="1">TENSILE OS</text>
      <text x="3" y="29" fill="#000000" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" font-weight="900" letter-spacing="1">TENSILE OS</text>
      <!-- Gradient Face -->
      <text x="0" y="26" fill="url(#iceCyan)" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" font-weight="900" letter-spacing="1">TENSILE OS</text>
    </g>
  </g>
</svg>
