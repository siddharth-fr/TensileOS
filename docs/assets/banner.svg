<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#101726"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1f293d" stroke-width="0.8" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="880" height="260" rx="12" fill="url(#bgGrad)"/>
  <rect width="880" height="260" rx="12" fill="url(#grid)"/>

  <!-- Left: Mini CRT Monitor with TensileOS Desktop -->
  <g transform="translate(40, 25)">
    <!-- Monitor Bezel -->
    <rect x="0" y="0" width="260" height="200" rx="8" fill="#d0d0d8" stroke="#909098" stroke-width="2"/>
    <rect x="10" y="10" width="240" height="170" rx="4" fill="#000000"/>
    
    <!-- Screen Desktop (Teal) -->
    <rect x="12" y="12" width="236" height="166" fill="#008080"/>
    
    <!-- Desktop Icons (mini) -->
    <rect x="18" y="18" width="12" height="12" fill="#c0c0c0"/>
    <text x="34" y="27" fill="#ffffff" font-family="monospace" font-size="8">System</text>
    <rect x="18" y="36" width="12" height="12" fill="#ffd700"/>
    <text x="34" y="45" fill="#ffffff" font-family="monospace" font-size="8">Files</text>
    <rect x="18" y="54" width="12" height="12" fill="#00ffcc"/>
    <text x="34" y="63" fill="#ffffff" font-family="monospace" font-size="8">Terminal</text>

    <!-- Mini Window 1: Hardware Lab -->
    <rect x="70" y="24" width="130" height="85" fill="#c0c0c0" stroke="#ffffff" stroke-width="1"/>
    <!-- Titlebar -->
    <rect x="72" y="26" width="126" height="12" fill="#000080"/>
    <text x="76" y="35" fill="#ffffff" font-family="monospace" font-size="8" font-weight="bold">Hardware Lab</text>
    <rect x="188" y="27" width="8" height="9" fill="#c0c0c0"/>
    <!-- Oscilloscope Screen -->
    <rect x="74" y="40" width="122" height="65" fill="#001808"/>
    <!-- Sine Wave -->
    <path d="M 76,72 Q 86,52 96,72 T 116,72 T 136,72 T 156,72 T 176,72 T 194,72" fill="none" stroke="#00ff66" stroke-width="1.8"/>

    <!-- Taskbar -->
    <rect x="12" y="160" width="236" height="18" fill="#c0c0c0"/>
    <line x1="12" y1="160" x2="248" y2="160" stroke="#ffffff" stroke-width="1"/>
    <!-- Start Button -->
    <rect x="14" y="162" width="40" height="14" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
    <rect x="16" y="164" width="8" height="10" fill="#004080"/>
    <text x="27" y="172" fill="#000000" font-family="sans-serif" font-size="8" font-weight="bold">Start</text>
    <!-- Tray Clock -->
    <rect x="206" y="163" width="38" height="12" fill="#b0b0b0" stroke="#808080" stroke-width="1"/>
    <text x="214" y="172" fill="#000000" font-family="monospace" font-size="8">12:00</text>

    <!-- Monitor Base -->
    <path d="M 100,200 L 160,200 L 175,212 L 85,212 Z" fill="#b0b0b8"/>
  </g>

  <!-- Right: Typography & Branding -->
  <g transform="translate(340, 45)">
    <!-- Small Category Pill -->
    <rect x="0" y="0" width="210" height="22" rx="11" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="12" y="15" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1">ESP32 RETRO WORKSTATION</text>

    <!-- Title -->
    <text x="0" y="68" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="1">TENSILE<tspan fill="#38bdf8">OS</tspan></text>

    <!-- Subtitle -->
    <text x="0" y="98" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">
      Bare-metal 32-bit retro desktop executing 100% on ESP32 silicon
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 122)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="135" height="26" rx="5" fill="#1e293b"/>
      <text x="12" y="17" fill="#f1f5f9" font-family="monospace" font-size="11">⚡ 320x240 @ 60 FPS</text>
      <!-- Tag 2 -->
      <rect x="145" y="0" width="130" height="26" rx="5" fill="#1e293b"/>
      <text x="157" y="17" fill="#f1f5f9" font-family="monospace" font-size="11">📶 Wi-Fi Streamed</text>
      <!-- Tag 3 -->
      <rect x="285" y="0" width="140" height="26" rx="5" fill="#1e293b"/>
      <text x="297" y="17" fill="#f1f5f9" font-family="monospace" font-size="11">💾 38.4 KB VRAM</text>
    </g>

    <!-- Sub-tagline -->
    <text x="0" y="174" fill="#64748b" font-family="monospace" font-size="12">
      Zero hardware wiring • 16 Native apps • FreeRTOS &amp; LittleFS
    </text>
  </g>
</svg>
